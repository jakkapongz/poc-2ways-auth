# SSL/TLS Configuration - Browser Access (No Client Cert Required)
# HTTPD authenticates to Spring Boot on behalf of the client

Listen 8080

# SSL Session Cache
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost _default_:8080>
    ServerName localhost
    ServerAdmin admin@example.com

    # Enable SSL/TLS
    SSLEngine on

    # Server Certificate (for browser HTTPS)
    SSLCertificateFile /usr/local/apache2/conf/certs/httpd-server-cert.pem
    SSLCertificateKeyFile /usr/local/apache2/conf/certs/httpd-server-key.pem

    # NO client certificate required from browser
    SSLVerifyClient none

    # Modern SSL/TLS configuration
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # Logging
    ErrorLog /proc/self/fd/2
    TransferLog /proc/self/fd/1
    LogLevel warn

    CustomLog /proc/self/fd/1 \
        "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"NO-CLIENT-CERT\" \"%r\" %b"

    # Reverse proxy configuration
    ProxyPreserveHost On
    ProxyTimeout 300

    # HTTPD uses its own client certificate to authenticate to Spring Boot
    # This demonstrates HTTPD acting as a trusted client
    SSLProxyEngine On

    # HTTPD presents client certificate to backend
    SSLProxyMachineCertificateFile /usr/local/apache2/conf/certs/httpd-client-bundle.pem

    # Verify backend server certificate
    SSLProxyCACertificateFile /usr/local/apache2/conf/certs/httpd-ca-cert.pem
    SSLProxyVerify require
    SSLProxyCheckPeerCN on
    SSLProxyCheckPeerName off

    # Add custom headers to indicate proxy authentication
    RequestHeader set X-Proxy-Client "httpd-proxy"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    RequestHeader set X-Original-Client "%{REMOTE_ADDR}e"

    # Proxy to Spring Boot application
    ProxyPass / https://spring-app:8443/
    ProxyPassReverse / https://spring-app:8443/

    <Location />
        Require all granted
    </Location>

    # Display message for root path
    <Location />
        Header set X-Auth-Method "HTTPD-Proxy-Authentication"
        Header set X-Client-Cert-Required "No - HTTPD authenticates on your behalf"
    </Location>

</VirtualHost>
