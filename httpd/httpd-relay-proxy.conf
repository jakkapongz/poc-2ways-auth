# Production Configuration - Relay Architecture
# Relay Component handles SSL/TLS termination
# HTTPD receives plain HTTP and proxies to Spring Boot with HTTPS + client cert

# ========================================================================
# ARCHITECTURE:
# User (HTTPS 443) → Relay → HTTPD (HTTP 14088) → Spring Boot (HTTPS 8443)
# ========================================================================

Listen 14088

<VirtualHost *:14088>
    ServerName localhost
    ServerAdmin admin@example.com

    # ===================================================================
    # INCOMING CONNECTION: Plain HTTP (NO SSL)
    # Relay component terminates SSL, so HTTPD receives unencrypted HTTP
    # ===================================================================

    # SSLEngine is NOT enabled for incoming connections
    # The Relay component handles all client-facing SSL/TLS

    # Logging
    ErrorLog /var/log/httpd/mtls_error_log
    CustomLog /var/log/httpd/mtls_access_log combined
    LogLevel warn

    # Log format to track proxy requests
    CustomLog /var/log/httpd/mtls_access_log \
        "%t %h \"NO-SSL\" \"%r\" %s %b \"%{User-Agent}i\""

    # ===================================================================
    # REVERSE PROXY CONFIGURATION
    # ===================================================================

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyRequests Off

    # ===================================================================
    # OUTGOING CONNECTION: HTTPS with Client Certificate Authentication
    # HTTPD authenticates to Spring Boot as a trusted proxy
    # ===================================================================

    # Enable SSL for outgoing connections to backend
    SSLProxyEngine On

    # HTTPD presents this client certificate to Spring Boot
    # This file contains both the certificate and private key
    SSLProxyMachineCertificateFile /etc/httpd/certs/httpd-client-bundle.pem

    # Verify Spring Boot's server certificate against this CA
    SSLProxyCACertificateFile /etc/httpd/certs/ca-cert.pem

    # Require valid certificate from backend
    SSLProxyVerify require
    SSLProxyCheckPeerCN on
    SSLProxyCheckPeerName off

    # ===================================================================
    # HEADERS - Track request origin
    # ===================================================================

    # Identify HTTPD as the authenticated proxy client
    RequestHeader set X-Proxy-Client "httpd-proxy"

    # Preserve original client IP from Relay
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"

    # Indicate original protocol
    RequestHeader set X-Forwarded-Proto "https"

    # Original host (if Relay sets it)
    RequestHeader set X-Original-Host "%{Host}e"

    # ===================================================================
    # PROXY ROUTES
    # Adjust context paths based on your application needs
    # ===================================================================

    # Option 1: Route specific context path
    ProxyPass /my-api https://localhost:8443/my-api
    ProxyPassReverse /my-api https://localhost:8443/my-api

    # Option 2: Route everything (uncomment if needed)
    # ProxyPass / https://localhost:8443/
    # ProxyPassReverse / https://localhost:8443/

    # ===================================================================
    # ACCESS CONTROL
    # ===================================================================

    <Location /my-api>
        # Allow all requests that reach this point
        # Access control is handled by:
        # 1. Relay component (client authentication if needed)
        # 2. Spring Boot (application-level security)
        Require all granted
    </Location>

    # Health check endpoint (optional)
    <Location /my-api/actuator/health>
        Require all granted
    </Location>

</VirtualHost>

# ========================================================================
# NOTES FOR PRODUCTION:
# ========================================================================
#
# 1. Certificate Files Required:
#    - /etc/httpd/certs/httpd-client-bundle.pem (HTTPD's client cert for backend)
#    - /etc/httpd/certs/ca-cert.pem (CA to verify Spring Boot's cert)
#
# 2. NO Server Certificate Needed:
#    - Relay handles all client-facing SSL/TLS
#    - HTTPD only receives plain HTTP
#
# 3. Required Modules:
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_http_module modules/mod_proxy_http.so
#    LoadModule headers_module modules/mod_headers.so
#    LoadModule ssl_module modules/mod_ssl.so
#    LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
#
# 4. Firewall Configuration:
#    - Port 14088: Accept from Relay only (internal)
#    - Port 8443: Accept from localhost only (internal)
#
# 5. Testing:
#    # From Relay (or localhost for testing):
#    curl http://localhost:14088/my-api/hello
#
#    # End-to-end through Relay:
#    curl https://your-relay-host/my-api/hello
#
# ========================================================================
